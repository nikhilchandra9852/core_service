spring.application.name=core_service
server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/vectordb

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=*

# Gemini OpenAI Compatible API

spring.ai.openai.api-key=AIzaSyD5oEIEhMR8fUuGhA4sFsEYo3DuTKXc2Ow

spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.embedding.base-url=https://generativelanguage.googleapis.com/v1beta/openai

spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.embedding.enabled=false

spring.ai.ollama.chat.enabled=false

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=bge-m3

# Debug logs

logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.http=DEBUG


# kakfa conusmer properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=core_service_consumer
spring.kafka.topic.name=repo-files
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer